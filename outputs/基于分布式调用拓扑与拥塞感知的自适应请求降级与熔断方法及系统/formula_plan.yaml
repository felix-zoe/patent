$schema: formula_plan
version: 1
updated_at: "2026-09-12T11:18:00+08:00"
theme_summary: "基于分布式调用拓扑与拥塞感知的自适应请求降级与熔断方法及系统"
paradigm_ids:
  - weighted_sum
  - ema_smooth
  - hysteresis_band
  - update_rule
plain_zh: "基于链路阻抗与滑动平滑加速度量化节点综合拥塞指数，通过滞回阈值触发阶梯降级与熔断，半开状态下按阻抗反馈自适应递增放行流量。"
equations:
  - tag: 1
    origin: agent
    paradigm_id: weighted_sum
    latex: "Z_{ij} = \\alpha \\cdot T_{ij}^{\\mathrm{norm}} + \\beta \\cdot Q_{j}^{\\mathrm{norm}}"
    role: score
  - tag: 2
    origin: agent
    paradigm_id: ema_smooth
    latex: "A_t = \\rho \\cdot A_{t-1} + (1 - \\rho) \\cdot a_t"
    role: smooth
  - tag: 3
    origin: agent
    paradigm_id: weighted_sum
    latex: "C_j = w_1 \\cdot \\sigma_j + w_2 \\cdot A_j + w_3 \\cdot B_j"
    role: score
  - tag: 4
    origin: agent
    paradigm_id: hysteresis_band
    latex: "x \\ge \\tau_{\\mathrm{hi}} ;\\ x \\le \\tau_{\\mathrm{lo}}"
    role: trigger
  - tag: 5
    origin: agent
    paradigm_id: weighted_sum
    latex: "P_{\\mathrm{pass}}(r) = \\min[1.0, \\max[0.0, 1.0 - \\frac{C_j - \\tau_{\\mathrm{lo}}}{\\tau_{\\mathrm{hi}} - \\tau_{\\mathrm{lo}}} \\cdot [1.0 - \\lambda_r]]]"
    role: score
  - tag: 6
    origin: agent
    paradigm_id: update_rule
    latex: "R_k \\leftarrow R_{k-1} + \\eta \\cdot e_k"
    role: assign
symbols:
  - symbol: "Z_{ij}"
    meaning_zh: 服务节点i到节点j调用链路的综合传播阻抗
    unit_zh: 无量纲
  - symbol: "T_{ij}^{\\mathrm{norm}}"
    meaning_zh: 归一化平均调用时延
    unit_zh: 无量纲
  - symbol: "Q_{j}^{\\mathrm{norm}}"
    meaning_zh: 归一化下游节点等待队列深度
    unit_zh: 无量纲
  - symbol: "\\alpha"
    meaning_zh: 时延权重系数
    unit_zh: 无量纲
  - symbol: "\\beta"
    meaning_zh: 队列深度权重系数
    unit_zh: 无量纲
  - symbol: "A_t"
    meaning_zh: 当前周期平滑处理后的流量加速度
    unit_zh: 无量纲
  - symbol: "a_t"
    meaning_zh: 当前周期瞬时流量加速度
    unit_zh: 无量纲
  - symbol: "\\rho"
    meaning_zh: 滑动平滑衰减系数
    unit_zh: 无量纲
  - symbol: "C_j"
    meaning_zh: 目标节点j的综合动态拥塞指数
    unit_zh: 无量纲
  - symbol: "\\sigma_j"
    meaning_zh: 节点j的瞬时处理利用率
    unit_zh: 无量纲
  - symbol: "B_j"
    meaning_zh: 节点j感知到的下游累积反压系数
    unit_zh: 无量纲
  - symbol: "w_1, w_2, w_3"
    meaning_zh: 综合拥塞指标加权系数
    unit_zh: 无量纲
  - symbol: "\\tau_{\\mathrm{hi}}"
    meaning_zh: 熔断与深度降级触发高阈值
    unit_zh: 无量纲
  - symbol: "\\tau_{\\mathrm{lo}}"
    meaning_zh: 恢复与半开探针触发低阈值
    unit_zh: 无量纲
  - symbol: "R_k"
    meaning_zh: 半开状态第k周期的流量放行比例
    unit_zh: 无量纲
  - symbol: "\\eta"
    meaning_zh: 恢复放行步长调节系数
    unit_zh: 无量纲
  - symbol: "e_k"
    meaning_zh: 链路健康度余量
    unit_zh: 无量纲
numeric_example:
  given:
    "T_{ij}^{\\mathrm{norm}}": 0.6
    "Q_{j}^{\\mathrm{norm}}": 0.4
    "\\alpha": 0.5
    "\\beta": 0.5
  compute_zh: "Z_{ij} = 0.5 * 0.6 + 0.5 * 0.4 = 0.5"
  result:
    "Z_{ij}": 0.5
notes_zh: "公式严格遵循无量纲归一化与防零除，禁止使用波浪号等装饰音。"
